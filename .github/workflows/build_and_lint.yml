name: Build & Lint
on:
  workflow_call:


jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "./pyproject.toml"
          prune-cache: true
      
      
      - name: Install dependencies
        run: |
          uv sync --locked --dev
          uv tool install just
      
      - name: Run ruff check
        run: just lint
      
      - name: Run Type Check
        run: just  type-check

name: Build & Lint
on:
  workflow_call:


jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "./pyproject.toml"
          prune-cache: true
      
      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: |
          uv sync --locked --dev
      
      - name: Run ruff check
        run: just lint
      
      - name: Run Type Check
        run: just  type-check
      
      - name: Setup env file
        run: cp .env.example .env

      - name: Run Tests
        run: just test


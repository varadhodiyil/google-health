
[project]
name = "google-health-client"
version = "1.1.0"
description = "Google Health API client"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "pydantic-settings>=2.16.2",
    "uritemplate>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.14",
    "ty>=0.0.96",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "google_health"
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 100
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D103", "D107", "D203", "D212", "CPY"]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
